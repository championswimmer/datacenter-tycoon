# Railway config-as-code for the Go server, deployed as a SEPARATE service from the TS server.
# In the Railway service settings, set "Config as code" to: packages/server-go/railway.toml
# (the root railway.toml belongs to the TS service and is unchanged).
# The Dockerfile path is relative to the repo root, which is the build context.

[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/server-go/Dockerfile"

[deploy]
preDeployCommand = ["/app/migrate"]
startCommand = "/app/server"
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
