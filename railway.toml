[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build:deploy -w @datacenter-tycoon/server"

[deploy]
preDeployCommand = ["npm run migrate -w @datacenter-tycoon/server"]
startCommand = "npm run start -w @datacenter-tycoon/server"
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
