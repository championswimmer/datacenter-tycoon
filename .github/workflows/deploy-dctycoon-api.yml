name: Deploy dctycoon-api to Railway

on:
  push:
    branches:
      - main
      - arnav/server-on-railway
    paths:
      - packages/server/**
      - packages/game-logic/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - Dockerfile
      - .dockerignore
      - railway.toml
      - .github/workflows/deploy-dctycoon-api.yml
  workflow_dispatch:

concurrency:
  group: railway-dctycoon-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload and deploy API service
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: 00549536-b2e0-49f8-888b-3ffc66275920
      RAILWAY_ENVIRONMENT: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Railway CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy dctycoon-api
        run: >-
          railway up
          --service "$RAILWAY_SERVICE_ID"
          --environment "$RAILWAY_ENVIRONMENT"
          --ci
          --message "GitHub Actions deploy ${GITHUB_SHA}"
