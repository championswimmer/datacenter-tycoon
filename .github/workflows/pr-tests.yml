name: PR Tests

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00 UTC every day
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Build packages
        run: npm run build

      - name: Validate server migrations
        run: npm run check:migrations:server

      - name: Run tests
        run: npm run test:ci

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: championswimmer/datacenter-tycoon
          files: ./packages/**/coverage/lcov.info

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/**/coverage/junit.xml

  go:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datacenter_tycoon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/datacenter_tycoon_test

    steps:
      - uses: actions/checkout@v4

      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/server-go/go.mod
          cache-dependency-path: packages/server-go/go.sum

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: npm ci

      - name: Build game-logic (TS black-box tests import its dist)
        run: npm run build -w @datacenter-tycoon/game-logic

      - name: Vet Go server
        working-directory: packages/server-go
        run: go vet ./...

      - name: Test Go server
        working-directory: packages/server-go
        run: go test ./...

      - name: Verify committed game-logic bundle is reproducible
        run: |
          bash packages/server-go/scripts/build-bundle.sh
          git diff --exit-code -- packages/server-go/jsbridge/bundle.js

      - name: Build Go server
        working-directory: packages/server-go
        run: go build -o "$RUNNER_TEMP/server" ./cmd/server

      - name: Start Go server (in-memory mode)
        # Mirrors the TS test env: NODE_ENV=test and SERVER_VERSION=9.9.9-test match the
        # /healthz and /version contracts; rate limits are raised because the suite issues
        # many requests from one client within a second.
        run: |
          nohup env \
            NODE_ENV=test \
            HOST=127.0.0.1 \
            PORT=3100 \
            SERVER_VERSION=9.9.9-test \
            CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:4173 \
            BACKEND_RATE_LIMIT_MAX_REQUESTS=100000 \
            PLAYER_REGISTRATION_RATE_LIMIT_MAX_REQUESTS=100000 \
            LEADERBOARD_SUBMISSION_RATE_LIMIT_MAX_REQUESTS=100000 \
            "$RUNNER_TEMP/server" > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"

      - name: Wait for Go server to become healthy
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/healthz; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "Go server did not become healthy"
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Run TS black-box contract tests against Go server
        run: npm run test:blackbox -w @datacenter-tycoon/server
        env:
          SERVER_BASE_URL: http://127.0.0.1:3100

      - name: Stop Go server
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/server.pid")" || true
          fi
          cat "$RUNNER_TEMP/server.log" || true
